name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Typecheck · Lint · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Usa exatamente o npm fixado em "packageManager" (package.json),
      # garantindo que o CI resolva o lockfile igual ao ambiente local.
      - name: Pin npm (packageManager)
        run: npm install -g "npm@$(node -p "require('./package.json').packageManager.split('@')[1]")"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  # O `next build` carrega os módulos de rota; como `db/index.ts` exige
  # DATABASE_URL na importação, passamos valores DUMMY (não há conexão em build,
  # pois as páginas autenticadas são dynamic e só consultam em request time).
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm (packageManager)
        run: npm install -g "npm@$(node -p "require('./package.json').packageManager.split('@')[1]")"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgres://user:pass@localhost:5432/db
          AUTH_SECRET: dummy-build-secret-not-used

  # Smoke tests de navegação (issue #27): builda de verdade, sobe um Postgres
  # efêmero (com pgvector, exigido pelo schema), roda migrations + seed e
  # ataca as rotas públicas com Playwright real — não substitui o job `build`
  # acima (que valida o build sem banco), complementa cobrindo se as páginas
  # de fato renderizam com dados.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: necroforja
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/necroforja
      AUTH_SECRET: dummy-e2e-secret-not-real-00000000000000
      AUTH_URL: http://localhost:3100
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: change-me-admin
      PLAYER_PASSWORD: change-me-player
      PLAYWRIGHT_PORT: "3100"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm (packageManager)
        run: npm install -g "npm@$(node -p "require('./package.json').packageManager.split('@')[1]")"

      - name: Install dependencies
        run: npm ci

      - name: Enable pgvector
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d necroforja -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Migrate + seed
        run: |
          npm run db:push -- --force
          npm run db:seed

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run Playwright smoke tests
        run: npx playwright test

      # Lighthouse CI (issue #42) — baseline NÃO bloqueante: as assertions do
      # lighthouserc.json são todas "warn" e o passo tem continue-on-error até
      # existir um baseline real pra calibrar thresholds. Roda aqui no job e2e
      # porque ele já tem o build + Postgres seedado que o `next start` usa.
      # O link do relatório (temporary-public-storage) sai no log do passo e
      # os JSONs ficam como artifact.
      - name: Lighthouse CI (non-blocking)
        run: npx lhci autorun
        continue-on-error: true

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 7

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
